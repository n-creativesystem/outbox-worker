services:
  dev:
    image: dev_outbox_worker
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ./:/src/
      - ~/.gitconfig:/.gitconfig
      - ~/.ssh/:/home/user/.ssh/
      - /var/run/docker.sock:/var/run/docker-host.sock
    tty: true
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-northeast-1
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: outbox
      MYSQL_USER: admin
      MYSQL_PASSWORD: pass1234
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql:/var/lib/mysql
      - ./tools/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./tools/mysql/scripts/:/docker-entrypoint-initdb.d/
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "localhost"
        - "-u"
        - "admin"
        - "-p$$MYSQL_PASSWORD"
      interval: 2s
      start_period: 5s
      retries: 10
      timeout: 10s
    networks:
      - default
  localstack:
    image: localstack/localstack:4.6.0
    environment:
      DEBUG: 1
      SERVICES: s3,sqs,sns,dynamodb
      LOCALSTACK_HOST: localhost:4566
      GATEWAY_LISTEN: 0.0.0.0:4566
      AWS_DEFAULT_REGION: ap-northeast-1
      DISABLE_CORS_CHECKS: 1
      DISABLE_CUSTOM_CORS_S3: 1
    volumes:
      - localstack:/var/lib/localstack
      - ./tools/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: >-
        curl -sf localhost:4566/_localstack/init/ready | grep -q '"completed": true,'
      interval: 2s
      start_period: 5s
      retries: 10
      timeout: 10s
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
volumes:
  mysql:
  localstack:
networks:
  default:
